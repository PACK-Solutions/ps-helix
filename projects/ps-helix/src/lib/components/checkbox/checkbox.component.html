<div class="psh-checkbox-container">
  <label class="psh-checkbox-label" [class.psh-label-left]="labelPosition() === 'left'">
    <input
      #checkboxInput
      type="checkbox"
      class="psh-checkbox-input"
      [checked]="checked()"
      [disabled]="disabled()"
      [required]="required()"
      [attr.aria-label]="computedAriaLabel()"
      [attr.aria-checked]="ariaChecked()"
      [attr.aria-required]="required() || null"
      [attr.aria-invalid]="error() ? 'true' : null"
      [attr.aria-describedby]="describedBy()"
      (change)="toggle()"
      (blur)="handleBlur()"
      (keydown)="handleKeydown($event)"
    />
    
    <span class="psh-checkbox-control">
      @if (checked() && !indeterminate()) {
        <i class="ph ph-check" aria-hidden="true"></i>
      }
      @if (indeterminate()) {
        <i class="ph ph-minus" aria-hidden="true"></i>
      }
    </span>

    <span class="psh-checkbox-text">
      <!-- The label alone: its text decides whether there is a visible label, so the mark stays out. -->
      <span #labelSlot>
        <!-- `}}}` on purpose: a line break after the label would render as a space before the mark. -->
        @if (label()) {
          {{ label() }}} @else {
          <ng-content></ng-content>
        }
      </span>
      @if (required()) {
        <span class="psh-required-mark" aria-hidden="true">*</span>
      }
    </span>
  </label>

  @if (error()) {
    <div [id]="uniqueId + '-error'" class="psh-checkbox-message psh-error" role="alert">
      {{ error() }}
    </div>
  } @else if (success()) {
    <div [id]="uniqueId + '-success'" class="psh-checkbox-message psh-success" role="status">
      {{ success() }}
    </div>
  } @else if (hint()) {
    <div [id]="uniqueId + '-hint'" class="psh-checkbox-message psh-hint">
      {{ hint() }}
    </div>
  }
</div>
