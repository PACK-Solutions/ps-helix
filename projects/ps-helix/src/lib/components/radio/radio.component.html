<div class="psh-radio-container">
  <label class="psh-radio-label" [class.psh-label-left]="labelPosition() === 'left'">
    <input
      type="radio"
      class="psh-radio-input"
      [checked]="checked()"
      [disabled]="disabled()"
      [required]="required()"
      [name]="name()"
      [attr.value]="value()"
      [attr.aria-label]="computedAriaLabel()"
      [attr.aria-required]="required() || null"
      [attr.aria-invalid]="error() ? 'true' : null"
      [attr.aria-checked]="checked()"
      [attr.aria-describedby]="ariaDescribedBy()"
      (change)="handleChange()"
      (keydown)="handleKeydown($event)"
    />
    <span 
      class="psh-radio-control"
      [class.psh-error]="!!error()"
      [class.psh-success]="!!success()"
    >
      <span class="psh-radio-dot"></span>
    </span>
    <span class="psh-radio-text" #labelSlot>
      @if (label()) {
        {{ label() }}
      } @else {
        <ng-content></ng-content>
      }
    </span>
  </label>

  @if (error()) {
    <div [id]="errorMessageId()" class="psh-radio-error" role="alert">
      {{ error() }}
    </div>
  } @else if (success()) {
    <div [id]="successMessageId()" class="psh-radio-success" role="status">
      {{ success() }}
    </div>
  } @else if (hint()) {
    <div [id]="hintMessageId()" class="psh-radio-hint">
      {{ hint() }}
    </div>
  }
</div>
