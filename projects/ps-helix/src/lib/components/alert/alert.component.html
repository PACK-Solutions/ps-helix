<div
  class="psh-alert"
  [class.psh-small]="size() === 'small'"
  [class.psh-large]="size() === 'large'"
  [class]="'psh-' + color()"
  [attr.role]="computedRole()"
  [attr.aria-label]="ariaLabel()"
  [attr.aria-live]="computedAriaLive()"
  [attr.data-state]="state()"
>
  <div class="psh-alert-content" [class.psh-icon-right]="iconPosition() === 'right'">
    @if (showIcon()) {
      <i class="ph ph-{{ getIcon() }}" aria-hidden="true"></i>
    }
    <div class="psh-alert-message">
      <ng-content>{{ content() }}</ng-content>
    </div>
  </div>

  <!--
    Actions. The alert had one slot, in the message area, so the standard pattern — a
    "Retry" button aligned to the right of the text — had nowhere to go.
  -->
  <div class="psh-alert-actions">
    <ng-content select="[psh-alert-actions]"></ng-content>
  </div>

  @if (closable()) {
    <button
      type="button"
      class="psh-alert-dismiss"
      (click)="handleClose()"
      [attr.aria-label]="dismissLabel()"
    >
      <i class="ph ph-x" aria-hidden="true"></i>
    </button>
  }
</div>
