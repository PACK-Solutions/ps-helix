@if (loading()) {
  <div class="psh-stat-loading">
    <div class="psh-skeleton-circle"></div>
    <div class="psh-skeleton-content">
      <div class="psh-skeleton-line"></div>
      <div class="psh-skeleton-line psh-short"></div>
    </div>
  </div>
} @else {
  @if (useRowDirection()) {
    <div class="psh-stat-card-body">
      @if (hasIcon()) {
        <div class="psh-stat-icon" [style]="iconStyle()">
          <i class="ph ph-{{ displayIcon }}" aria-hidden="true"></i>
        </div>
      }

      <div class="psh-stat-content">
        <h3 class="psh-stat-value">{{ displayValue }}</h3>
        <p class="psh-stat-description">{{ displayDescription }}</p>

        @if (hasTag()) {
          <psh-tag [color]="displayTagVariant!">
            {{ displayTagLabel }}
          </psh-tag>
        }
      </div>
    </div>
  } @else {
    @if (hasIcon()) {
      <div class="psh-stat-icon" [style]="iconStyle()">
        <i class="ph ph-{{ displayIcon }}" aria-hidden="true"></i>
      </div>
    }

    <div class="psh-stat-content">
      <h3 class="psh-stat-value">{{ displayValue }}</h3>
      <p class="psh-stat-description">{{ displayDescription }}</p>

      @if (hasTag()) {
        <psh-tag [color]="displayTagVariant!">
          {{ displayTagLabel }}
        </psh-tag>
      }
    </div>
  }
}
