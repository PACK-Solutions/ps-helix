<div
  class="psh-tabs-container"
  [class.psh-animated]="animated()"
>
  <div
    class="psh-tabs-header"
    [class]="'psh-' + variant()"
    role="tablist"
    [attr.aria-orientation]="ariaOrientation()"
  >
    <!-- Tracked by position: see psh-stepper. `tabsToDisplay()` rebuilds its objects. -->
    @for (tab of tabsToDisplay(); track $index; let i = $index) {
      <button
        class="psh-tab-button"
        role="tab"
        [class.psh-active]="i === activeIndex()"
        [attr.aria-selected]="i === activeIndex()"
        [attr.aria-disabled]="tab.disabled || null"
        [attr.aria-controls]="idPrefix + '-panel-' + i"
        [attr.aria-label]="tab.ariaLabel || tab.header"
        [attr.id]="idPrefix + '-tab-' + i"
        [tabindex]="i === activeIndex() ? 0 : -1"
        [disabled]="tab.disabled"
        (click)="$event.preventDefault(); selectTab(i)"
        (keydown)="handleKeyDown($event, i)"
      >
        @if (tab.icon) {
          <i class="ph ph-{{ tab.icon }}" aria-hidden="true"></i>
        }
        {{ tab.header }}
      </button>
    }
  </div>

  <div class="psh-tabs-content">
    @if (hasContentProjection()) {
      <ng-content />
    } @else {
      @for (tab of tabsToDisplay(); track $index; let i = $index) {
        <div
          class="psh-tab-panel"
          role="tabpanel"
          [class.psh-active]="i === activeIndex()"
          [attr.aria-labelledby]="idPrefix + '-tab-' + i"
          [attr.id]="idPrefix + '-panel-' + i"
          [attr.tabindex]="i === activeIndex() ? 0 : -1"
          [attr.hidden]="i !== activeIndex() || null"
        >
          {{ tab.content }}
        </div>
      }
    }
  </div>
</div>
