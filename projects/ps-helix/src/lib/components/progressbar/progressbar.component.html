@if (showLabel()) {
  <span class="psh-progress-label">{{ displayLabel() }}</span>
}
<div
  class="psh-progressbar"
  [class.psh-striped]="isStriped()"
  [class.psh-animated]="isAnimated()"
  [class.psh-indeterminate]="isIndeterminate()"
  role="progressbar"
  [attr.aria-label]="ariaLabel() || label() || 'Progression'"
  [attr.aria-valuenow]="isIndeterminate() ? null : value()"
  [attr.aria-valuemin]="0"
  [attr.aria-valuemax]="max()"
  [attr.aria-valuetext]="computedAriaValueText()"
>
  <div
    class="psh-progress-track"
    [class]="'psh-' + color()"
    [style.width.%]="percentage()"
  ></div>
</div>
