<div
  class="psh-tooltip-wrapper"
  [attr.id]="triggerId()"
  [attr.aria-describedby]="isVisible() ? tooltipId() : null"
>
  <ng-content></ng-content>

  @if (isVisible()) {
    <div
      [attr.id]="tooltipId()"
      class="psh-tooltip"
      [class.psh-top]="computedPosition() === 'top'"
      [class.psh-bottom]="computedPosition() === 'bottom'"
      [class.psh-left]="computedPosition() === 'left'"
      [class.psh-right]="computedPosition() === 'right'"
      [class.psh-light]="variant() === 'light'"
      [class.psh-dark]="variant() === 'dark'"
      [style.max-width.px]="maxWidth()"
      role="tooltip"
    >
      {{ content() }}
      <div class="psh-tooltip-arrow"></div>
    </div>
  }
</div>
