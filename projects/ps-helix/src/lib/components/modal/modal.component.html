<!--
  The backdrop. Pointer dismissal only; the keyboard path is Escape, handled on the document.
  It carries no role since 7.0.0 — the dialog is the panel inside it — so the two rules that
  were satisfied by role="dialog" have to be waived explicitly instead.
-->
<!-- eslint-disable-next-line @angular-eslint/template/click-events-have-key-events, @angular-eslint/template/interactive-supports-focus -->
<div
  #modalBackdrop
  [class]="'psh-modal-backdrop ' + backdropClass()"
  [class.psh-open]="open()"
  (click)="handleBackdropClick($event)"
  [style.z-index]="zIndex()"
  [attr.aria-hidden]="!open()"
  [attr.data-state]="state()"
>
  <div
    [class]="'psh-modal-container ' + panelClass()"
    [class.psh-small]="size() === 'small'"
    [class.psh-medium]="size() === 'medium'"
    [class.psh-large]="size() === 'large'"
    [attr.id]="modalDialogId()"
    role="dialog"
    aria-modal="true"
    [attr.aria-labelledby]="labelledBy()"
    [attr.aria-label]="ariaLabel() || null"
    [attr.aria-describedby]="modalDescriptionId()"
    [pshFocusTrap]="open()"
  >
    <div class="psh-modal-content-wrapper">
      <div class="psh-modal-header">
        <h2 class="psh-modal-title" [attr.id]="modalDialogId() + '-title'">
          <ng-content select="[psh-modal-title]">{{ title() }}</ng-content>
        </h2>
        @if (showClose()) {
        <button
          type="button"
          class="psh-modal-close"
          (click)="handleClose()"
          [attr.aria-label]="dismissLabel()"
        >
          <i class="ph ph-x" aria-hidden="true"></i>
        </button>
        }
      </div>

      <div class="psh-modal-content" [attr.id]="modalDescriptionId()">
        <ng-content>
          <p>
            Modal content goes here. You can replace this with your own content.
          </p>
        </ng-content>
      </div>

      @if (showFooter() && !hasCustomFooter()) {
      <div class="psh-modal-footer">
        <psh-button
          appearance="outline"
          color="primary"
          size="medium"
          [fullWidth]="isMobileScreen()"
          (clicked)="handleClose()">
          {{ cancelLabel() }}
        </psh-button>
        <psh-button
          appearance="solid"
          color="primary"
          size="medium"
          [fullWidth]="isMobileScreen()"
          (clicked)="handleConfirm()">
          {{ confirmLabel() }}
        </psh-button>
      </div>
      } @if (showFooter() && hasCustomFooter()) {
      <div class="psh-modal-footer">
        <!--
          Note: When using a custom footer, buttons should also use [fullWidth]="isMobileScreen()"
          to ensure proper responsive behavior on mobile devices.
          Example:
          <psh-button [fullWidth]="isMobileScreen()" (clicked)="action()">Custom Button</psh-button>
        -->
        <ng-content select="[psh-modal-footer]" #modalFooter></ng-content>
      </div>
      }
    </div>
  </div>
</div>
