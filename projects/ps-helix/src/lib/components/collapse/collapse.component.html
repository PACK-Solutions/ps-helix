<div
  class="psh-collapse"
  [class.psh-expanded]="expanded()"
  [class.psh-disabled]="disabled()"
  [class.psh-outline]="appearance() === 'outline'"
  [class.psh-small]="size() === 'small'"
  [class.psh-large]="size() === 'large'"
  [class.psh-no-animation]="disableAnimation()"
  [attr.data-state]="state()"
  [style.--psh-collapse-max-height]="maxHeight()"
>
  <button
    [id]="headerId()"
    class="psh-collapse-header"
    (click)="toggle()"
    (keydown)="onKeydown($event)"
    [attr.aria-expanded]="expanded()"
    [attr.aria-controls]="contentId()"
    [disabled]="disabled()"
    type="button"
  >
    <span class="psh-header-content">
      <ng-content select="[collapse-header]">
        <span>Section pliable</span>
      </ng-content>
    </span>
    <i
      class="ph ph-{{ icon() }}"
      [class.psh-expanded]="expanded()"
      aria-hidden="true"
    ></i>
  </button>

  <div
    [id]="contentId()"
    class="psh-collapse-content"
    role="region"
    [attr.aria-labelledby]="headerId()"
    [attr.aria-hidden]="!expanded()"
    [attr.inert]="expanded() ? null : ''"
  >
    <div class="psh-content-wrapper">
      <ng-content></ng-content>
    </div>
  </div>
</div>
