@switch (variant()) {
  @case ('circle') {
    <div class="psh-spinner-circle" [class]="'psh-' + color()"></div>
  }
  @case ('dots') {
    <div class="psh-spinner-dots" [class]="'psh-' + color()">
      <div class="psh-dot"></div>
      <div class="psh-dot"></div>
      <div class="psh-dot"></div>
    </div>
  }
  @case ('pulse') {
    <div class="psh-spinner-pulse" [class]="'psh-' + color()">
      <div class="psh-pulse"></div>
      <div class="psh-pulse"></div>
      <div class="psh-pulse"></div>
    </div>
  }
}

@if (label()) {
  <span class="psh-spinner-label">{{ label() }}</span>
}
