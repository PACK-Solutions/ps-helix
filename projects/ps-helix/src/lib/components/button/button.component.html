<button
  [attr.data-state]="state()"
  [attr.aria-label]="computedAriaLabel()"
  [attr.aria-busy]="loading()"
  [type]="type()"
  [class]="'psh-' + appearance()"
  [class.psh-primary]="color() === 'primary'"
  [class.psh-secondary]="color() === 'secondary'"
  [class.psh-success]="color() === 'success'"
  [class.psh-warning]="color() === 'warning'"
  [class.psh-danger]="color() === 'danger'"
  [class.psh-disabled]="disabled()"
  [class.psh-loading]="loading()"
  [class.psh-small]="size() === 'small'"
  [class.psh-medium]="size() === 'medium'"
  [class.psh-large]="size() === 'large'"
  [class.psh-icon-only]="iconPosition() === 'only'"
  [disabled]="disabled() || loading()"
  (click)="handleClick($event)"
>
  <span class="psh-button-content">
    @if (loading()) {
      <span class="psh-loader" aria-hidden="true"></span>
      @if (iconPosition() !== 'only') {
        {{ loadingText() }}
      }
    }
    @if (!loading() && icon() && (iconPosition() === 'left' || iconPosition() === 'only')) {
      <i class="ph ph-{{ icon() }}" aria-hidden="true"></i>
    }
    @if (!loading() && iconPosition() !== 'only') {
      <ng-content></ng-content>
    }
    @if (!loading() && icon() && iconPosition() === 'right') {
      <i class="ph ph-{{ icon() }}" aria-hidden="true"></i>
    }
  </span>
</button>
