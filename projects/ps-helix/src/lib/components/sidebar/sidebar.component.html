<div
  class="psh-sidebar"
  [class.psh-open]="open()"
  [class.psh-fixed]="effectiveMode() === 'fixed'"
  [class.psh-overlay]="effectiveMode() === 'overlay'"
  [class.psh-left]="position() === 'left'"
  [class.psh-right]="position() === 'right'"
  [style.width]="width()"
  [style.--psh-sidebar-width]="width()"
  [pshFocusTrap]="open()"
  [pshFocusTrapAutoFocus]="autoFocus()"
>
  <div class="psh-sidebar-content">
    <ng-content></ng-content>
  </div>
</div>

@if (effectiveMode() === 'overlay' && open()) {
  <div
    class="psh-sidebar-backdrop"
    role="presentation"
    (click)="handleBackdropClick()"
  ></div>
}
