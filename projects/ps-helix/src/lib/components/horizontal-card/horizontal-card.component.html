<!-- Contenu latéral -->
<div class="psh-horizontal-side">
  @if (loading()) {
    <div class="psh-horizontal-skeleton"></div>
  } @else {
    <ng-content select="[psh-horizontal-card-side]"></ng-content>
  }
</div>

<!-- Contenu principal -->
<div class="psh-horizontal-content">
  @if (loading()) {
    <div class="psh-horizontal-loading">
      <div class="psh-skeleton-line"></div>
      <div class="psh-skeleton-line"></div>
      <div class="psh-skeleton-line psh-short"></div>
    </div>
  } @else {
    <!-- Header optionnel -->
    <ng-content select="[psh-horizontal-card-header]"></ng-content>

    <!-- Contenu principal -->
    <ng-content></ng-content>

    <!-- Actions optionnelles -->
    <ng-content select="[psh-horizontal-card-actions]"></ng-content>
  }
</div>
