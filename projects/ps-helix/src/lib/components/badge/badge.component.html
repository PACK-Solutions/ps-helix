<!-- Badge click is an optional convenience; the badge is a status/img indicator, not a primary control. -->
<!-- eslint-disable-next-line @angular-eslint/template/click-events-have-key-events, @angular-eslint/template/interactive-supports-focus -->
<div
  class="psh-badge"
  [class.psh-primary]="color() === 'primary'"
  [class.psh-secondary]="color() === 'secondary'"
  [class.psh-success]="color() === 'success'"
  [class.psh-warning]="color() === 'warning'"
  [class.psh-danger]="color() === 'danger'"
  [class.psh-info]="color() === 'info'"
  [class.psh-neutral]="color() === 'neutral'"
  [class.psh-disabled]="disabled()"
  [class.psh-dot]="displayType() === 'dot'"
  [class.psh-counter]="displayType() === 'counter'"
  [class.psh-overlap]="overlap()"
  [class.psh-small]="size() === 'small'"
  [class.psh-medium]="size() === 'medium'"
  [class.psh-large]="size() === 'large'"
  [class.psh-top-right]="position() === 'top-right'"
  [class.psh-top-left]="position() === 'top-left'"
  [class.psh-bottom-right]="position() === 'bottom-right'"
  [class.psh-bottom-left]="position() === 'bottom-left'"
  [attr.role]="computedRole()"
  [attr.aria-label]="computedAriaLabel()"
  [attr.data-state]="state()"
  (click)="onBadgeClick()"
>
  @if (displayType() === 'text') {
    <ng-content></ng-content>
  } @else if (displayType() === 'counter') {
    {{ displayValue() }}
  }
</div>
