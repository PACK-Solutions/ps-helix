<div
  class="psh-tag"
  [class.psh-primary]="color() === 'primary'"
  [class.psh-secondary]="color() === 'secondary'"
  [class.psh-success]="color() === 'success'"
  [class.psh-warning]="color() === 'warning'"
  [class.psh-danger]="color() === 'danger'"
  [class.psh-small]="size() === 'small'"
  [class.psh-large]="size() === 'large'"
  [class.psh-disabled]="disabled()"
  [attr.role]="computedRole()"
  [attr.tabindex]="computedTabIndex()"
  [attr.aria-label]="computedAriaLabel()"
  [attr.aria-disabled]="disabled() || null"
  [attr.data-state]="state()"
  (click)="handleClick($event)"
  (keydown)="handleKeydown($event)"
>
  @if (icon()) {
    <i class="ph ph-{{ icon() }}" aria-hidden="true"></i>
  }
  <span class="psh-tag-content">
    <ng-content>{{ content() }}</ng-content>
  </span>
  @if (closable()) {
    <button
      type="button"
      class="psh-tag-close"
      (click)="handleClose($event)"
      [attr.aria-label]="closeLabel()"
      [disabled]="disabled()"
    >
      <i class="ph ph-x" aria-hidden="true"></i>
    </button>
  }
</div>
