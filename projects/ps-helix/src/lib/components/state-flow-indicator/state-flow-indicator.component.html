<div class="psh-flow-track" role="tablist">
  @for (step of steps(); track $index; let i = $index) {
    <div
      class="psh-flow-segment"
      [class.psh-active]="i === activeStep()"
      [class.psh-completed]="step.completed"
      [class.psh-disabled]="step.disabled || (!step.completed && i !== activeStep() && !canActivateStep(i))"
      [class.psh-error]="!!step.error"
      [class.psh-warning]="!!step.warning"
      [class.psh-loading]="step.loading"
      [class.psh-first]="i === 0"
      [class.psh-last]="i === steps().length - 1"
      role="tab"
      [attr.tabindex]="i === activeStep() ? 0 : -1"
      [attr.id]="idPrefix + '-tab-' + i"
      [attr.aria-controls]="idPrefix + '-panel-' + i"
      [attr.aria-selected]="i === activeStep()"
      [attr.aria-disabled]="step.disabled || (!step.completed && i !== activeStep() && !canActivateStep(i))"
      [attr.aria-label]="getStepAriaLabel(step, i)"
      [attr.aria-current]="i === activeStep() ? 'step' : null"
      [attr.aria-busy]="step.loading"
      (click)="handleStepClick(i)"
      (keydown)="handleKeydown($event, i)"
    >
      <span class="psh-flow-segment-content">
        @if (step.loading) {
          <i class="ph ph-circle-notch psh-spinner" aria-hidden="true"></i>
        } @else if (step.error) {
          <i class="ph ph-x-circle" aria-hidden="true"></i>
        } @else if (step.warning) {
          <i class="ph ph-warning" aria-hidden="true"></i>
        } @else if (step.icon) {
          <i class="ph ph-{{ step.icon }}" aria-hidden="true"></i>
        } @else if (step.completed) {
          <i class="ph ph-check-circle" aria-hidden="true"></i>
        }
        <span class="psh-flow-segment-labels">
          <span class="psh-flow-segment-title">{{ step.title }}</span>
          @if (step.subtitle) {
            <span class="psh-flow-segment-subtitle">{{ step.subtitle }}</span>
          }
        </span>
      </span>
    </div>
  }
</div>

<!--
  The panels. Missing until 7.0.0: `psh-flow-step` rendered `template: ''` behind a permanent
  `display: none`, and there was no `<ng-content>` here either, so anything projected into a
  step was discarded without a word. `psh-stepper` has always done this.
-->
<ng-content />
