<div
  class="psh-switch-container"
  [class.psh-small]="size() === 'small'"
  [class.psh-large]="size() === 'large'"
>
  <label class="psh-switch-label" [class]="labelPosition() === 'left' ? 'psh-label-left' : 'psh-label-right'">
    <input
      #switchInput
      type="checkbox"
      class="psh-switch-input"
      [id]="id()"
      [name]="name() || id()"
      [checked]="checked()"
      [disabled]="disabled()"
      [required]="required()"
      [attr.aria-label]="computedAriaLabel()"
      [attr.aria-required]="required()"
      [attr.aria-invalid]="!!error()"
      [attr.aria-checked]="checked()"
      [attr.aria-describedby]="describedBy()"
      (change)="toggle()"
    />
    <span class="psh-switch-control">
      <span class="psh-switch-thumb"></span>
    </span>
    <span class="psh-switch-text">
      @if (label()) {
        {{ label() }}
      } @else {
        <ng-content>Switch</ng-content>
      }
    </span>
  </label>

  @if (error()) {
    <div [id]="errorId()!" class="psh-switch-error" role="alert" aria-live="polite">
      {{ error() }}
    </div>
  } @else if (success()) {
    <div [id]="successId()!" class="psh-switch-success" role="status" aria-live="polite">
      {{ success() }}
    </div>
  }
</div>
