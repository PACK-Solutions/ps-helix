<div
  class="psh-dropdown-container"
  [class]="'psh-' + size()"
  [class.psh-open]="isOpen()"
  [class.psh-disabled]="disabled()"
  [class.psh-icon-only]="isIconOnly()"
  [attr.data-state]="state()"
>
  <button
    class="psh-dropdown-trigger"
    [class]="'psh-' + appearance()"
    [class.psh-primary]="color() === 'primary'"
    [class.psh-secondary]="color() === 'secondary'"
    [class.psh-success]="color() === 'success'"
    [class.psh-warning]="color() === 'warning'"
    [class.psh-danger]="color() === 'danger'"
    (click)="toggleDropdown()"
    (keydown)="handleTriggerKeyDown($event)"
    [attr.aria-expanded]="isOpen()"
    [attr.aria-disabled]="disabled()"
    [attr.aria-label]="computedAriaLabel()"
    [attr.aria-haspopup]="'menu'"
    type="button"
    [disabled]="disabled()"
  >
    <span class="psh-trigger-content">
      @if (isIconOnly()) {
        <i class="ph ph-{{ icon() }}" aria-hidden="true"></i>
      } @else {
        @if (icon()) {
          <i class="ph ph-{{ icon() }}" aria-hidden="true"></i>
        }
        <ng-content select="[psh-dropdown-trigger]">
          @if (label()) {
            {{ label() }}
          }
        </ng-content>
        <i
          class="ph ph-caret-down psh-trigger-arrow"
          [class.psh-open]="isOpen()"
          aria-hidden="true"
        ></i>
      }
    </span>
  </button>

  <ng-template #menuTpl>
    <!-- stopPropagation only (keeps clicks inside the menu from closing it); not a user interaction. -->
    <!-- eslint-disable-next-line @angular-eslint/template/click-events-have-key-events, @angular-eslint/template/interactive-supports-focus -->
    <div
      class="psh-dropdown-menu"
      [class]="'psh-' + resolvedPlacement()"
      role="menu"
      (click)="$event.stopPropagation()"
    >
      <ng-content select="[psh-dropdown-menu]">
        @for (item of items(); track item.value; let i = $index) {
          <button
            type="button"
            class="psh-dropdown-item"
            [class.psh-disabled]="item.disabled"
            [class.psh-active]="selectedItem() === item"
            [attr.data-dropdown-item-index]="i"
            (click)="selectItem(item)"
            (keydown)="handleItemKeyDown($event, item, i)"
            role="menuitem"
            [attr.aria-disabled]="item.disabled"
            [disabled]="item.disabled"
            [attr.tabindex]="item.disabled ? -1 : 0"
          >
            @if (item.icon) {
              <i class="ph ph-{{ item.icon }}" aria-hidden="true"></i>
            }
            <span class="psh-item-label">{{ item.content }}</span>
          </button>
        }
      </ng-content>
    </div>
  </ng-template>
</div>
