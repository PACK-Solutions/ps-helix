<div class="psh-tab-bar">
  @for (item of items(); track item.id; let i = $index) {
    <button
      #tabButton
      type="button"
      class="psh-tab-item"
      [class.psh-active]="activeIndex() === i"
      [class.psh-disabled]="disabled() || item.disabled"
      role="tab"
      [attr.aria-selected]="activeIndex() === i"
      [attr.aria-disabled]="disabled() || item.disabled"
      [attr.aria-label]="item.label"
      [attr.tabindex]="activeIndex() === i ? 0 : -1"
      (click)="selectTab(i)"
      (keydown)="onKeydown($event, i)"
    >
      @if (itemTemplate()) {
        <ng-container
          [ngTemplateOutlet]="itemTemplate()!"
          [ngTemplateOutletContext]="itemContext(item, i)"
        ></ng-container>
      } @else {
        <i
          [class]="activeIndex() === i ? 'ph-fill ph-' + item.icon : 'ph ph-' + item.icon"
          aria-hidden="true"
        ></i>
        <span class="psh-tab-label">{{ item.label }}</span>
        @if (item.badge) {
          <span class="psh-tab-badge">{{ item.badge }}</span>
        }
      }
    </button>
  }
</div>
