name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    name: Lint · Test · Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # Fails if TOKENS.md drifted from the stylesheets, or if a token exists in one
      # theme and not the other — the asymmetry that left seven palette families
      # rendering their light values in dark mode.
      - name: Token reference and theme parity
        run: npm run verify:tokens

      # Four components render with ViewEncapsulation.None so they can style projected
      # content, which means every class they declare is global. Fails if one escapes the
      # psh- namespace, or if the codemod's rename map drifted from the stylesheets.
      - name: Class namespace and codemod map
        run: npm run verify:classes

      # The dark tokens exist twice — once under [data-theme="dark"], once under
      # prefers-color-scheme — so the stylesheet is correct without the theme service. The
      # second copy is generated; this fails if the two have drifted.
      - name: Auto dark theme in sync
        run: npm run verify:auto-dark

      # px in a media query does not scale with browser zoom, and a max-width written on the
      # breakpoint itself is true at the same width as the min-width beside it.
      - name: Responsive scale
        run: npm run verify:breakpoints

      # Every settable default, generated from the tokens. A hand-written list of 201
      # defaults drifts, and four of these tokens had already drifted from their own
      # interface before this was in place.
      - name: Configuration reference
        run: npm run verify:config

      - name: Unit tests (with coverage gate)
        run: npm run test:coverage

      - name: Build library
        run: npm run build:lib

      # psh-radio-group was built to carry the form contract and shipped unreachable:
      # listed in a barrel the demo imports and the entry point does not. Reads the
      # generated .d.ts, because that file is the contract a consumer actually gets.
      - name: Public API reachability
        run: npm run verify:public-api

      - name: Bundle smoke test (import-cycle guard)
        run: npm run verify:bundle

      - name: Bundle size budget
        run: npm run size
