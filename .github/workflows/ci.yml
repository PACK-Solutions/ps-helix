name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    name: Lint · Test · Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # Fails if TOKENS.md drifted from the stylesheets, or if a token exists in one
      # theme and not the other — the asymmetry that left seven palette families
      # rendering their light values in dark mode.
      - name: Token reference and theme parity
        run: npm run verify:tokens

      # Four components render with ViewEncapsulation.None so they can style projected
      # content, which means every class they declare is global. Fails if one escapes the
      # psh- namespace, or if the codemod's rename map drifted from the stylesheets.
      - name: Class namespace and codemod map
        run: npm run verify:classes

      - name: Unit tests (with coverage gate)
        run: npm run test:coverage

      - name: Build library
        run: npm run build:lib

      - name: Bundle smoke test (import-cycle guard)
        run: npm run verify:bundle

      - name: Bundle size budget
        run: npm run size
